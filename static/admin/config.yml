  - name: "services"
    label: "Service"
    folder: "src/pages/services"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Template Key", name: "templateKey", widget: "hidden", default: "services-page"}
      - {label: Heading, name: heading, widget: string}
      - {label: Subheading, name: subheading, widget: string}
      - {label: "Title", name: "title", widget: "string"} 
      - {label: "Sort description", name: "sortDescription", widget: "text"} 
      - {label: "Long description", name: "longDescription", widget: "text"} 
      - {label: "Featured Image", name: "featuredimage", widget: image}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "jobs"
    label: "Job"
    folder: "src/pages/jobs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Template Key", name: "templateKey", widget: "hidden", default: "jobs-page"}
      - {label: Heading, name: heading, widget: string}
      - {label: Subheading, name: subheading, widget: string}
      - {label: "Title", name: "title", widget: "string"} 
      - {label: "Sort description", name: "sortDescription", widget: "text"} 
      - {label: "Long description", name: "longDescription", widget: "text"} 
      - {label: "Featured Image", name: "featuredimage", widget: image}
      - {label: "Body", name: "body", widget: "markdown"} 
